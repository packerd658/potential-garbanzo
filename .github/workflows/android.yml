name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleDebug assembleRelease lintDebug --console=plain
      - name: Name APK after the version
        run: cp app/build/outputs/apk/release/app-release.apk "HomePanel-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: home-panel-apk
          path: HomePanel-*.apk

  release:
    # Pushing a tag like v1.0.0 publishes the APK as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: home-panel-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: HomePanel-*.apk
          generate_release_notes: true
          body: |
            Home Panel for Home Assistant, with local, Tailscale and remote access.
            Runs on Android 7.0 (API 24) through Android 17 (API 37).

            Download the APK below and open it on your phone to install
            (allow "Install unknown apps" for your browser or file manager if asked).
