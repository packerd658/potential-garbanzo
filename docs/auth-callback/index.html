<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Home Panel login</title>
<style>
  :root { --bg: #f6f8fa; --text: #14202b; --muted: #55636f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1419; --text: #e6edf2; --muted: #9aaab6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 26em; text-align: center; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Return to Home Panel</h1>
  <p>This page is where Home Assistant hands your login back to the Home Panel app. The app normally catches it before this page opens. If you're seeing this, go back to the app and tap <strong>Log in</strong> again.</p>
</main>
<script>
  // Don't leave the one-time login code in the address bar or history.
  if (location.search) history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
